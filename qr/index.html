<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>QR-Codes — Ruth &amp; Max</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Karla:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #5b2a10; --paper: #f6f1e7; --card: #fffdf8; --line: rgba(91, 42, 16, 0.3); }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 300 14px/1.5 Karla, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
      h1 { margin: 0 0 4px; font: 400 44px/1 Caveat, cursive; }
      input, button { font: inherit; color: inherit; }
      input[type='text'], input[type='password'], input[type='search'] { width: 100%; border: none; border-bottom: 1.5px solid var(--line); background: transparent; padding: 6px 2px; outline: none; }
      button { cursor: pointer; border: 1.5px solid var(--ink); background: transparent; padding: 7px 14px; }
      button.primary { background: var(--ink); color: var(--paper); }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 18px 0; }
      .row > label { flex: 1 1 220px; }
      .note { font-size: 12.5px; opacity: 0.75; }
      .warn { color: #a8562f; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
      .card { background: var(--card); border: 1px solid var(--line); padding: 14px; text-align: center; break-inside: avoid; }
      .card svg { display: block; width: 100%; height: auto; }
      .card h2 { margin: 6px 0 0; font: 400 24px/1.1 Caveat, cursive; }
      .card .meta { font-size: 12px; opacity: 0.75; }
      .card .code { font: 500 15px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.15em; margin-top: 4px; }
      .card button { margin-top: 8px; padding: 4px 10px; font-size: 12px; }
      [hidden] { display: none !important; }
      @media print {
        body { background: #fff; }
        .no-print { display: none !important; }
        main { padding: 0; max-width: none; }
        .grid { grid-template-columns: repeat(3, 1fr); gap: 8mm; }
        .card { border: 1px dashed #bbb; }
        .card button { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QR-Codes</h1>
      <p class="note no-print">Ein Code pro Einladung, direkt aus dem Gäste-Tab. Mitkommende („Gehört zu") stehen mit auf der Karte.</p>

      <form id="login" class="row no-print">
        <label>Passwort<input type="password" id="password" autocomplete="current-password" required /></label>
        <button type="submit" class="primary">Gäste laden</button>
      </form>
      <p id="status" class="note no-print" role="status"></p>

      <section id="list" hidden>
        <div class="row no-print">
          <label>Link im QR-Code<input type="text" id="site" /></label>
          <label>Suchen<input type="search" id="filter" placeholder="Name …" /></label>
          <button type="button" id="print">Drucken</button>
        </div>
        <p id="site-warn" class="note warn no-print" hidden></p>
        <div id="cards" class="grid"></div>
      </section>
    </main>
    <script type="module" src="/src/qr-page.ts"></script>
  </body>
</html>
